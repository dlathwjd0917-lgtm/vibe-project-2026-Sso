<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="VLAST Shop 공식 상품 상세 페이지입니다.">
  <title>상품 상세 | VLAST Shop</title>
  <link rel="preload" href="assets/fonts/spoqa-han-sans-neo-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 사이트 공통 상단 헤더 (siteLayout.js 모듈에서 일괄 제어) -->
  <header class="site-header" id="site-header"></header>

  <!-- 상품 상세 본문 메인 -->
  <main class="detail-page" id="main">
    <div class="inner-box" id="detail-app">
      <!-- 브레드크럼 -->
      <nav class="detail-breadcrumb" id="detail-breadcrumb" aria-label="현재 위치">
        <a href="index.html">홈</a>
        <span>/</span>
        <a href="index.html#category">ALBUM</a>
      </nav>

      <!-- 상세 2단 레이아웃 -->
      <article class="detail-layout">
        <!-- 좌측 대형 이미지 -->
        <div class="detail-visual">
          <div class="detail-visual__image-wrap">
            <img class="detail-visual__image" id="detail-image" src="" alt="상품 상세 이미지">
            <!-- 마우스 오버 시 나타나는 WISH / ADD 액션 버튼 -->
            <div class="card__hover-actions" id="detail-visual-hover-actions">
              <button type="button" class="card__hover-btn card__hover-btn--wish" id="detail-hover-wish-btn" aria-label="관심상품 담기">WISH</button>
              <button type="button" class="card__hover-btn card__hover-btn--add" id="detail-hover-add-btn" aria-label="장바구니 담기">ADD</button>
            </div>
            <span class="detail-visual__zoom-tip">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              마우스를 올려보세요
            </span>
          </div>
          <div class="detail-visual__thumbs" id="detail-thumbs"></div>
        </div>

        <!-- 우측 상품 정보 및 주문 -->
        <div class="detail-info">
          <h1 class="detail-info__title" id="detail-title">상품명을 불러오는 중입니다...</h1>

          <div class="detail-info__meta">
            <div class="detail-info__row">
              <span class="detail-info__label">판매가</span>
              <span class="detail-info__val detail-info__val--price" id="detail-price">-</span>
            </div>
            <div class="detail-info__row">
              <span class="detail-info__label">국내·해외배송</span>
              <span class="detail-info__val">국내배송</span>
            </div>
            <div class="detail-info__row">
              <span class="detail-info__label">배송방법</span>
              <span class="detail-info__val">택배</span>
            </div>
            <div class="detail-info__row">
              <span class="detail-info__label">배송비</span>
              <span class="detail-info__val detail-info__val--shipping">3,000원 (50,000원 이상 구매 시 무료)</span>
            </div>
          </div>

          <!-- 옵션 선택 영역 -->
          <div class="detail-options">
            <label class="detail-options__label" for="detail-option-select">구매조건 확인 및 동의</label>
            <select class="detail-options__select" id="detail-option-select">
              <option value="기본">- [필수] 옵션을 선택해 주세요 -</option>
              <option value="기본" selected>옵션 동의 및 선택 (기본)</option>
            </select>
            <p class="detail-options__hint">(최소주문수량 1개 이상)</p>
          </div>

          <!-- 수량 및 총 금액 박스 -->
          <div class="detail-qty-box">
            <div class="detail-qty-row">
              <span class="detail-qty-name">수량</span>
              <div class="detail-qty-ctrl">
                <button type="button" class="detail-qty-btn" id="detail-qty-minus" aria-label="수량 감소">-</button>
                <input type="number" class="detail-qty-input" id="detail-qty-input" value="1" min="1" aria-label="주문 수량">
                <button type="button" class="detail-qty-btn" id="detail-qty-plus" aria-label="수량 증가">+</button>
              </div>
            </div>
            <div class="detail-total-row">
              <span class="detail-total-label">TOTAL (QUANTITY)</span>
              <span class="detail-total-val" id="detail-total-val">0원 <span>(0개)</span></span>
            </div>
          </div>

          <!-- 하단 버튼군 (장바구니 버튼만 활성화) -->
          <div class="detail-actions">
            <button type="button" class="detail-btn detail-btn--buy" id="detail-btn-buy">BUY IT NOW</button>
            <button type="button" class="detail-btn detail-btn--cart" id="detail-btn-cart">CART</button>
            <button type="button" class="detail-btn detail-btn--wish" id="detail-btn-wish">WISH LIST</button>
          </div>
        </div>
      </article>
    </div>
  </main>

  <!-- 사이트 공통 하단 컴포넌트 (모바일 바텀바, 플로팅UI, 푸터: siteLayout.js 모듈에서 일괄 제어) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="하단 고정 메뉴"></nav>
  <nav class="floating-ui" id="floating-ui" aria-label="바로가기"></nav>
  <footer class="site-footer" id="site-footer"></footer>

  <!-- 상세 페이지 및 공통 레이아웃 초기화 스크립트 -->
  <script type="module">
    import { initSiteLayout } from './js/components/siteLayout.js';
    import { initProductDetail } from './js/modules/detail.js';

    // 공통 상단/하단 모듈 렌더링 및 인증/장바구니 상태 동기화
    initSiteLayout({ activePage: 'detail' });
    initProductDetail();
  </script>
</body>
</html>
