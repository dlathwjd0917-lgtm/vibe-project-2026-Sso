<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="VLAST Shop 로그인 페이지입니다.">
    <title>로그인 | VLAST Shop</title>
    <link rel="preload" href="assets/fonts/spoqa-han-sans-neo-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body class="login-page">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <!-- 사이트 공통 상단 헤더 (siteLayout.js 모듈에서 일괄 제어) -->
    <header class="site-header" id="site-header"></header>

    <main class="login-page__main" id="main">
      <div class="login-container">
        <!-- 상단 헤더 & 브레드크럼 (공지사항 동일 양식) -->
        <header class="member-header">
          <div class="member-header__top">
            <h1 class="member-header__title">MEMBER</h1>
            <nav class="member-header__breadcrumb" aria-label="현재 위치">
              <a href="index.html">HOME</a>
              <span>&gt;</span>
              <strong>LOGIN</strong>
            </nav>
          </div>
        </header>

        <!-- 로그인 폼 카드 -->
        <section class="auth-card" aria-labelledby="login-section-title">
          <div class="auth-card__heading">
            <div class="auth-card__heading-text" id="login-section-title">로그인</div>
            <span class="auth-card__badge">LOGIN</span>
          </div>

          <form id="login-form" novalidate autocomplete="on">
            <div class="auth-group">
              <label class="auth-label" for="login-id">아이디 <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="login-id" name="username" class="auth-input" placeholder="아이디를 입력해 주세요." autocomplete="username" required>
            </div>

            <div class="auth-group">
              <label class="auth-label" for="login-password">비밀번호 <span class="required" aria-hidden="true">*</span></label>
              <input type="password" id="login-password" name="password" class="auth-input" placeholder="비밀번호를 입력해 주세요." autocomplete="current-password" required>
            </div>

            <button type="submit" class="auth-submit-btn" id="login-submit-btn">로그인</button>
            <div class="auth-status-message" id="login-status-msg" role="status" aria-live="polite"></div>

            <!-- 관리자 계정 원클릭 체험 박스 -->
            <div class="auth-quick-admin-box">
              <div class="auth-quick-admin-info">
                <strong>🔑 관리자(Admin) 계정 정보</strong><br>
                아이디: <code>admin</code> / 비밀번호: <code>1111</code> (뚝스 / 공지사항 글쓰기·수정·삭제 가능)
              </div>
              <button type="button" class="auth-quick-admin-btn" id="quick-fill-admin-btn">관리자 계정 자동입력</button>
            </div>

            <!-- 하단 회원가입 페이지 이동 링크 -->
            <div class="auth-card__footer-links">
              <span>아직 회원이 아니신가요?</span>
              <a href="signup.html">회원가입 페이지로 이동 &rarr;</a>
            </div>
          </form>
        </section>
      </div>
    </main>

    <!-- 사이트 공통 하단 컴포넌트 (모바일 바텀바, 플로팅UI, 푸터: siteLayout.js 모듈에서 일괄 제어) -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="모바일 하단 메뉴"></nav>
    <nav class="floating-ui" id="floating-ui" aria-label="바로가기"></nav>
    <footer class="site-footer" id="site-footer"></footer>

    <!-- 로그인 로직 및 공통 레이아웃 초기화 -->
    <script type="module">
      import { initSiteLayout } from "./js/components/siteLayout.js";
      initSiteLayout({ activePage: "login" });
    </script>
    <script type="module" src="js/modules/login.js"></script>
  </body>
</html>
